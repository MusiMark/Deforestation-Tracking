<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deforestation Risk Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1410;
            color: #e0f2e9;
            padding: 20px;
            min-height: 100vh;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: rgba(18, 38, 28, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 102, 0.2);
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            gap: 10px;
        }
        .dashboard-header h1 {
            color: #00ff66;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .dashboard-header p {
            color: #a8d5ba;
            font-size: 14px;
        }
        .back-btn {
            color: #a8d5ba;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            border-color: #00ff66;
            color: #00ff66;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border-left: 3px solid #00ff66;
        }
        .stat-box .number {
            font-size: 28px;
            font-weight: 700;
            color: #00ff66;
            font-family: 'Fira Code', monospace;
        }
        .stat-box .label {
            font-size: 12px;
            color: #a8d5ba;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .card {
            background: rgba(18, 38, 28, 0.7);
            border: 1px solid rgba(0, 255, 102, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .card h3 {
            color: #a8d5ba;
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .card-full {
            grid-column: 1 / -1;
        }
        .chart-container {
            position: relative;
            height: 250px;
        }
        .loading-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            color: #a8d5ba;
            grid-column: 1 / -1;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 102, 0.1);
            border-top-color: #00ff66;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            color: #f87171;
            text-align: center;
            padding: 40px;
            grid-column: 1 / -1;
        }
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="dashboard-header">
    <div>
        <h1>🌳 Deforestation Risk Dashboard</h1>
        <p>Interactive visualization of deforestation patterns and risk factors</p>
    </div>
    <a href="/" class="back-btn">← Back to Predictor</a>
</div>

<!-- Stats Summary -->
<div class="stats-grid" id="stats-grid">
    <div class="stat-box">
        <div class="number" id="total-records">--</div>
        <div class="label">Total Records</div>
    </div>
    <div class="stat-box">
        <div class="number" id="total-loss">--</div>
        <div class="label">Total Loss (ha)</div>
    </div>
    <div class="stat-box">
        <div class="number" id="high-risk">--</div>
        <div class="label">High Risk %</div>
    </div>
    <div class="stat-box">
        <div class="number" id="avg-loss">--</div>
        <div class="label">Avg Loss (ha)</div>
    </div>
</div>

<!-- Charts Grid -->
<div class="grid-container" id="charts-container">
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <span>Loading dashboard data...</span>
    </div>
</div>

<script>
    async function loadDashboard() {
        try {
            console.log('🔄 Fetching dashboard data...');
            const response = await fetch('/api/dashboard-data');
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            console.log('✅ Data received:', data);
            
            // Check for error
            if (data.error) {
                throw new Error(data.error);
            }
            
            // Remove loading
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
            
            // Update stats
            const riskDist = data.risk_distribution || [];
            const regionLoss = data.region_loss || [];
            
            const totalRecords = riskDist.reduce((sum, r) => sum + (r.Count || 0), 0);
            const totalLoss = regionLoss.reduce((sum, r) => sum + (r.Avg_Loss || 0), 0);
            const highRisk = riskDist.find(r => r.Risk === 'High');
            const highRiskPct = highRisk ? ((highRisk.Count / totalRecords) * 100).toFixed(1) : '0';
            const avgLoss = regionLoss.length > 0 ? (totalLoss / regionLoss.length).toFixed(1) : '0';
            
            document.getElementById('total-records').textContent = totalRecords;
            document.getElementById('total-loss').textContent = totalLoss.toFixed(0);
            document.getElementById('high-risk').textContent = highRiskPct + '%';
            document.getElementById('avg-loss').textContent = avgLoss;
            
            // Render charts
            renderCharts(data);
            
        } catch (error) {
            console.error('❌ Error loading dashboard:', error);
            const container = document.getElementById('charts-container');
            container.innerHTML = `<div class="error-msg">❌ Error: ${error.message}</div>`;
        }
    }
    
    function renderCharts(data) {
        const container = document.getElementById('charts-container');
        
        // Define chart configurations
        const chartConfigs = [
            { 
                id: 'chart-risk', 
                title: 'Risk Distribution', 
                type: 'bar', 
                data: data.risk_distribution || [], 
                xKey: 'Risk', 
                yKey: 'Count',
                colors: ['#4ade80', '#facc15', '#f87171'],
                label: 'Records'
            },
            { 
                id: 'chart-region', 
                title: 'Loss by Region', 
                type: 'bar', 
                data: data.region_loss || [], 
                xKey: 'Region', 
                yKey: 'Avg_Loss',
                colors: ['#60a5fa', '#34d399', '#a78bfa', '#f472b6'],
                label: 'Avg Loss (ha)'
            },
            { 
                id: 'chart-forest', 
                title: 'Loss by Forest Type', 
                type: 'bar', 
                data: data.forest_loss || [], 
                xKey: 'Forest_Type', 
                yKey: 'Avg_Loss',
                colors: ['#34d399', '#60a5fa', '#a78bfa', '#f472b6', '#fbbf24', '#f87171'],
                label: 'Avg Loss (ha)'
            },
            { 
                id: 'chart-risk-rate', 
                title: 'Loss Rate by Risk', 
                type: 'bar', 
                data: data.risk_loss_rate || [], 
                xKey: 'Risk', 
                yKey: 'Loss_Rate',
                colors: ['#4ade80', '#facc15', '#f87171'],
                label: 'Loss Rate (%)'
            },
            { 
                id: 'chart-logging', 
                title: 'Illegal Logging Impact', 
                type: 'bar', 
                data: data.logging_loss || [], 
                xKey: 'Illegal_Logging', 
                yKey: 'Tree_Cover_Loss_ha',
                colors: ['#60a5fa', '#f472b6'],
                label: 'Avg Loss (ha)'
            },
            { 
                id: 'chart-time', 
                title: 'Loss Over Time', 
                type: 'line', 
                data: data.yearly_loss || [], 
                xKey: 'Year', 
                yKey: 'Tree_Cover_Loss_ha',
                color: '#00ff66',
                label: 'Avg Loss (ha)'
            },
            { 
                id: 'chart-fire', 
                title: 'Fire Incidents by Region', 
                type: 'bar', 
                data: data.fire_region || [], 
                xKey: 'Region', 
                yKey: 'Fire_Incidents',
                colors: ['#f87171', '#fb923c', '#fbbf24', '#34d399'],
                label: 'Avg Fire Incidents',
                fullWidth: true
            }
        ];
        
        // Create cards for each chart
        chartConfigs.forEach((config) => {
            const card = document.createElement('div');
            card.className = 'card';
            if (config.fullWidth) card.classList.add('card-full');
            
            card.innerHTML = `
                <h3>${config.title}</h3>
                <div class="chart-container">
                    <canvas id="${config.id}"></canvas>
                </div>
            `;
            container.appendChild(card);
        });
        
        // Initialize charts after DOM update
        setTimeout(() => {
            chartConfigs.forEach(config => {
                const canvas = document.getElementById(config.id);
                if (!canvas) {
                    console.warn(`Canvas ${config.id} not found`);
                    return;
                }
                const ctx = canvas.getContext('2d');
                
                const labels = config.data.map(d => String(d[config.xKey] || ''));
                const values = config.data.map(d => d[config.yKey] || 0);
                const colors = config.colors || ['#00ff66'];
                
                // Skip if no data
                if (labels.length === 0) {
                    console.warn(`No data for ${config.id}`);
                    return;
                }
                
                new Chart(ctx, {
                    type: config.type,
                    data: {
                        labels: labels,
                        datasets: [{
                            label: config.label || config.title,
                            data: values,
                            backgroundColor: config.type === 'line' ? 'rgba(0, 255, 102, 0.1)' : colors.slice(0, labels.length),
                            borderColor: config.color || '#00ff66',
                            borderWidth: 2,
                            fill: config.type === 'line' ? true : false,
                            tension: 0.3,
                            pointBackgroundColor: config.color || '#00ff66',
                            pointRadius: config.type === 'line' ? 4 : 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: 'rgba(0,0,0,0.8)',
                                titleColor: '#e0f2e9',
                                bodyColor: '#a8d5ba',
                                callbacks: {
                                    label: function(context) {
                                        return context.dataset.label + ': ' + context.parsed.y.toFixed(1);
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: { color: '#a8d5ba', maxRotation: 30 },
                                grid: { color: 'rgba(255,255,255,0.05)' }
                            },
                            y: {
                                ticks: { color: '#a8d5ba' },
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                beginAtZero: true
                            }
                        }
                    }
                });
                console.log(`✅ Chart ${config.id} rendered`);
            });
        }, 300);
    }
    
    // Load dashboard when page loads
    document.addEventListener('DOMContentLoaded', loadDashboard);
</script>

</body>
</html>
